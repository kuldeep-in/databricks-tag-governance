command:
  - "streamlit"
  - "run"
  - "app.py"
  - "--server.port=8000"
  - "--server.address=0.0.0.0"
  - "--server.headless=true"

env:
  # The SQL warehouse used for all queries and grant statements.
  - name: SQL_WAREHOUSE_ID
    value: 00000000aaaa

  # Delta table that persists app configuration (catalog.schema.table).
  # The app creates this table automatically on first startup if it does not exist.
  - name: CONFIG_TABLE
    value: classic_stable_kuldeep01.default.uc_tag_governance_config

  # The Unity Catalog catalog whose information_schema is queried for table and tag metadata.
  - name: INFO_CATALOG
    value: classic_stable_kuldeep01
